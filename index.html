<body>
  <header class="bar">
    <nav class="bar-inner" aria-label="Main">
      <a class="wordmark" href="index.html">FOLIO</a>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <ul id="menu" class="menu">
        <li><a href="index.html" aria-current="page">Home</a></li>

  <main>
    <div class="wrap">
      <section class="welcome">
        <h1>For the people back home</h1>
        <p class="lede">Too many photos and nowhere to share them. Folio gathers a trip into one place that is easy to share.</p>
        <a class="btn btn-primary" href="trip.html">Start a trip</a>

      <figure class="print print-wide">
        <img src="images/welcome-collage.jpg" width="1760" height="964" alt="An example collage made with Folio for the Japan trip: six photos around a panel reading Japan, including a golden temple among pine trees, a glass tower under storm clouds, a street lit with neon signs and a room full of glowing lanterns.">
      </figure>

    <div class="recent">
      <div class="wrap">
        <section class="trip-section" id="recent-section" aria-labelledby="recent-title" hidden>

          <h2 id="examples-title">Example trips</h2>
          <ul class="trip-grid" id="example-list"></ul>

      </div>
