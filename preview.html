<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio · Preview</title>
  <meta name="description" content="Preview your video or collage.">
  <meta property="og:title" content="Folio · Preview">
  <meta property="og:description" content="Preview your video or collage.">
  <!-- Share image (og:image): to be supplied by the owner. See SPEC.md, Open questions. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Poppins:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <header class="bar">
    <nav class="bar-inner" aria-label="Main">
      <a class="wordmark" href="index.html">FOLIO</a>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <ul id="menu" class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="trips.html" aria-current="page">Trips</a></li>
        <li><a href="about.html">About</a></li>
        <li class="logout"><a href="login.html" data-logout>Log out</a></li>
      </ul>
    </nav>
  </header>

  <main class="wrap">
    <p class="page-head" id="not-found" hidden>This trip could not be found. <a href="trips.html">See all trips</a></p>
    <div id="step-view" hidden>
      <div class="page-head head-row">
        <h1>Preview</h1>
        <h2 id="trip-name" class="trip-name-h2"></h2>
      </div>

      <p class="lede" id="collage-soon" hidden>The collage preview is coming soon.</p>

      <div id="video-preview" hidden>
        <figure class="print player">
          <div class="player-screen">
            <video id="video" playsinline preload="auto" aria-label="Your trip video"></video>
            <p class="player-status" id="player-status" role="status">Making your video…</p>
          </div>
          <div class="player-controls">
            <button class="play-btn" type="button" id="play" aria-label="Play" disabled>&#9654;</button>
            <input class="scrubber" type="range" id="scrubber" min="0" max="0" step="0.01" value="0" aria-label="Position in the video" disabled>
            <span class="player-time" id="time">0:00 / 0:00</span>
          </div>
        </figure>

        <p class="export-row">
          <button class="btn btn-primary" type="button" id="export" disabled>Export</button>
        </p>
        <p class="error" id="export-error" hidden></p>
      </div>

      <nav class="step-row" id="step-row" aria-label="Step navigation"></nav>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/steps.js"></script>
  <script src="js/video.js"></script>
  <script src="js/preview.js"></script>
</body>
</html>
