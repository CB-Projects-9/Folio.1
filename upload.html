<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio · Upload</title>
  <meta name="description" content="Name a trip and add its photos.">
  <meta property="og:title" content="Folio · Upload">
  <meta property="og:description" content="Name a trip and add its photos.">
  <!-- Share image (og:image): to be supplied by the owner. See SPEC.md, Open questions. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <header class="bar">
    <nav class="bar-inner" aria-label="Main">
      <a class="wordmark" href="index.html">FOLIO</a>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <ul id="menu" class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="trips.html" aria-current="page">Trips</a></li>
        <li><a href="about.html">About</a></li>
        <li class="logout"><a href="login.html" data-logout>Log out</a></li>
      </ul>
    </nav>
  </header>

  <main class="wrap">
    <p class="page-head" id="not-found" hidden>This trip could not be found. <a href="trips.html">See all trips</a></p>
    <div id="trip-view" hidden>
      <div class="page-head">
        <h1 id="trip-heading">New trip</h1>
      </div>

      <div class="field trip-title-field">
        <label for="trip-title">Trip title</label>
        <input id="trip-title" maxlength="80" autocomplete="off" placeholder="Where did you go?">
      </div>

      <p class="caption" id="photo-count" aria-live="polite">0 photos</p>

      <div class="dropzone" id="dropzone">
        <p>Drop photos here</p>
        <button class="btn btn-secondary" type="button" id="choose">Choose photos</button>
        <input id="file-input" type="file" accept="image/*" multiple hidden>
        <p class="caption" id="adding" role="status"></p>
        <p class="error" id="add-error" hidden></p>
      </div>

      <p class="continue-row">
        <button class="btn btn-primary" type="button" id="continue" disabled>Continue</button>
      </p>

      <ul class="photo-grid" id="photo-grid"></ul>

      <nav class="step-row" id="step-row" aria-label="Step navigation"></nav>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/steps.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
